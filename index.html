<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Random Archive — Spy Ghost</title>
<style>
  :root{
    --bg:#0a1024; --panel:#0f1730; --teal:#3fd8c9; --violet:#9b7fe0; --gold:#e0b463; --ink:#f2f4fa;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
    font-family:-apple-system,'Segoe UI',sans-serif;}
  body{
    background:
      radial-gradient(500px 400px at 15% -5%, rgba(155,127,224,.12), transparent 70%),
      radial-gradient(500px 400px at 85% 10%, rgba(63,216,201,.10), transparent 70%),
      var(--bg);
  }
  .wrap{max-width:760px;margin:0 auto;padding:60px 18px 90px;}
  header{text-align:center;margin-bottom:36px;}
  header p.tag{font-size:.78rem;color:#9fb0d6;letter-spacing:2.5px;text-transform:uppercase;margin:0 0 6px;}
  header h1{margin:0;font-size:clamp(1.5rem,5vw,2.2rem);font-weight:700;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .box{position:relative;background:var(--panel);border:1px solid rgba(224,180,99,.2);
    border-radius:12px;overflow:hidden;}
  .box::before,.box::after{content:"";position:absolute;width:12px;height:12px;
    border:1.5px solid #4d7fc9;opacity:.7;}
  .box::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:4px 0 0 0;}
  .box::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 4px 0;}
  .pic-wrap{aspect-ratio:4/3;background:#0c1330;overflow:hidden;position:relative;}
  .pic-wrap img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s ease;}
  .pic-wrap img.show{opacity:1;}
  .shimmer{position:absolute;inset:0;background:linear-gradient(100deg,#0c1330 30%,#182150 50%,#0c1330 70%);
    background-size:200% 100%;animation:shine 1.6s linear infinite;}
  @keyframes shine{to{background-position:-200% 0;}}
  .desc{padding:10px 12px 14px;font-size:.82rem;line-height:1.55;color:#d5dcef;min-height:2.6em;}
  .desc.empty{color:#5c6684;font-style:italic;}

  .controls{margin-top:38px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .key-row{display:flex;gap:8px;width:100%;max-width:400px;}
  .key-row input{flex:1;background:#0f1730;border:1px solid rgba(155,127,224,.35);
    border-radius:8px;padding:10px 12px;color:var(--ink);font-size:.85rem;}
  .key-row input::placeholder{color:#5c6684;}

  .fetch-btn{padding:14px 34px;border-radius:10px;border:2px solid var(--teal);
    background:transparent;color:var(--ink);font-weight:700;letter-spacing:1px;font-size:.9rem;
    cursor:pointer;animation:neonPulse 2.8s ease-in-out infinite;}
  .fetch-btn:disabled{opacity:.5;cursor:default;animation:none;}
  @keyframes neonPulse{
    0%,100%{box-shadow:0 0 6px var(--teal), inset 0 0 6px rgba(63,216,201,.25);border-color:var(--teal);}
    50%{box-shadow:0 0 22px var(--violet), inset 0 0 12px rgba(155,127,224,.4);border-color:var(--violet);}}

  .status{font-size:.78rem;color:#9fb0d6;min-height:1.2em;text-align:center;}
  .status.err{color:#e08a8a;}

  @media (prefers-reduced-motion: reduce){ .shimmer,.fetch-btn{animation:none;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="tag">Spy Ghost // experiment</p>
    <h1>Random Archive</h1>
  </header>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="Gemini API Key">
    </div>
    <button class="fetch-btn" id="fetchBtn">FETCH SIX</button>
    <p class="status" id="status"></p>
  </div>
</div>

<script>
const grid = document.getElementById('grid');
const btn = document.getElementById('fetchBtn');
const keyInput = document.getElementById('apiKey');
const statusEl = document.getElementById('status');

keyInput.value = localStorage.getItem('sg_gemini_key') || '';

for(let i=0;i<6;i++){
  const box = document.createElement('div');
  box.className = 'box';
  box.innerHTML = `
    <div class="pic-wrap" id="pic-${i}"><div class="shimmer"></div></div>
    <p class="desc empty" id="desc-${i}">waiting…</p>`;
  grid.appendChild(box);
}

function setStatus(msg, isErr){
  statusEl.textContent = msg;
  statusEl.className = 'status' + (isErr ? ' err' : '');
}

async function fetchSix(){
  const key = keyInput.value.trim();
  if(!key){ setStatus('حط الـ API key الأول', true); return; }
  localStorage.setItem('sg_gemini_key', key);
  btn.disabled = true;
  setStatus('بيفكر...');

  for(let i=0;i<6;i++){
    document.getElementById(`pic-${i}`).innerHTML = '<div class="shimmer"></div>';
    const d = document.getElementById(`desc-${i}`);
    d.textContent = 'waiting…'; d.classList.add('empty');
  }

  const prompt = `Give me 6 completely different, unrelated, interesting everyday objects, animals, places, or concepts. Respond with STRICT JSON only, no markdown fences, no explanation, exactly this shape:
{"items":[{"keyword":"single English word good for an image search","desc":"one short vivid sentence in Egyptian Arabic describing it"}]}
Exactly 6 items in the array.`;

  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${encodeURIComponent(key)}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    if(!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();
    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    text = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);
    const items = parsed.items.slice(0,6);

    items.forEach((it, i)=>{
      const picWrap = document.getElementById(`pic-${i}`);
      const img = new Image();
      img.src = `https://loremflickr.com/400/300/${encodeURIComponent(it.keyword)}`;
      img.alt = it.keyword;
      img.onload = ()=>{ picWrap.innerHTML=''; picWrap.appendChild(img); requestAnimationFrame(()=>img.classList.add('show')); };
      img.onerror = ()=>{ picWrap.innerHTML = '<div class="shimmer"></div>'; };
      const d = document.getElementById(`desc-${i}`);
      d.textContent = it.desc; d.classList.remove('empty');
    });
    setStatus('تم ✓');
  }catch(err){
    setStatus('حصل خطأ: ' + err.message, true);
  }finally{
    btn.disabled = false;
  }
}

btn.addEventListener('click', fetchSix);
</script>
</body>
</html>
